<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحضير المعلمين</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1f2a24;--muted:#6b7570;--line:#e3ddd0}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--card:#1c221e;--ink:#eef2ee;--muted:#9aa59f;--line:#2c3530}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;padding:16px;box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 24px;text-align:center;max-width:420px;width:100%}
h1{margin:0 0 8px;font-size:24px}p{margin:0;color:var(--muted)}
</style>
</head>
<body><div class="card"><h1>تم إغلاق رابط التحضير</h1><p>هذا الرابط لم يعد متاحًا.</p></div></body>
</html>
